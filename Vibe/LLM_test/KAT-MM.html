<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mastermind</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --board-bg: #0f3460;
    --attempt-bg: #1a1a2e;
    --text: #e0e0e0;
    --accent: #e94560;
    --peg-size: clamp(36px, 10vw, 52px);
    --dot-size: clamp(14px, 4vw, 20px);
    --circle-size: clamp(48px, 13vw, 64px);
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    padding: 8px 16px 4px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: clamp(18px, 5vw, 26px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* ===== GAME BOARD ===== */
  .board-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 4px 12px;
  }

  .board {
    flex: 1;
    background: var(--board-bg);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    position: relative;
    border: 2px solid #1a3a6a;
  }

  .board-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a6a9a;
    font-size: clamp(13px, 3.5vw, 17px);
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .board-empty.hidden { opacity: 0; }

  /* attempt row */
  .attempt-row {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    animation: slideIn 0.25s ease-out;
  }
  .attempt-row:last-child { border-bottom: none; }

  @keyframes slideIn {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .attempt-num {
    font-size: clamp(11px, 3vw, 14px);
    color: #6a8abf;
    min-width: 28px;
    text-align: right;
    flex-shrink: 0;
  }

  .attempt-pegs {
    display: flex;
    gap: 6px;
    flex-shrink: 1;
  }

  .peg {
    width: var(--peg-size);
    height: var(--peg-size);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .peg.empty {
    background: rgba(255,255,255,0.05) !important;
    border-style: dashed;
    border-color: rgba(255,255,255,0.15);
  }

  .result-dots {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    flex-shrink: 0;
  }

  .dot {
    width: var(--dot-size);
    height: var(--dot-size);
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .dot.black {
    background: #222;
    border-color: #555;
    box-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
  .dot.white {
    background: #f0f0f0;
    border-color: #ccc;
    box-shadow: 0 0 4px rgba(255,255,255,0.3);
  }

  /* ===== CURRENT ATTEMPT ===== */
  .current-section {
    padding: 8px 12px 6px;
    flex-shrink: 0;
  }
  .current-label {
    font-size: 12px;
    color: #6a8abf;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
  }
  .current-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 16px;
    border: 2px solid #1a3a6a;
  }
  .current-row .peg {
    cursor: default;
  }

  /* ===== CONTROL PANEL ===== */
  .control-panel {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 2px solid #1a3a6a;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .colors-block {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    flex-shrink: 0;
  }

  .color-btn {
    width: var(--circle-size);
    height: var(--circle-size);
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .color-btn:active {
    transform: scale(0.88);
    box-shadow: 0 0 12px currentColor;
  }
  .color-btn::after {
    content: '';
    position: absolute;
    top: 15%;
    left: 22%;
    width: 28%;
    height: 22%;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
  }

  .btns-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .action-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: transform 0.1s, opacity 0.1s;
    min-width: 90px;
    text-align: center;
  }
  .action-btn:active { transform: scale(0.95); }
  .action-btn:disabled { opacity: 0.35; cursor: default; }

  .btn-check {
    background: var(--accent);
    color: #fff;
  }
  .btn-undo {
    background: #3a3a5c;
    color: var(--text);
  }

  .new-game-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 2px solid #3a3a5c;
    border-radius: 8px;
    color: #6a8abf;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    margin-top: 2px;
  }
  .new-game-btn:active { background: #3a3a5c; color: #fff; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    max-width: 300px;
    width: 90%;
    transform: scale(0.8);
    transition: transform 0.3s;
  }
  .modal-overlay.show .modal { transform: scale(1); }

  .modal h2 {
    font-size: 22px;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .modal p {
    font-size: 15px;
    color: #a0b0d0;
    margin-bottom: 16px;
  }

  .modal-answer {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .modal-answer .peg {
    width: clamp(40px, 12vw, 52px);
    height: clamp(40px, 12vw, 52px);
    border-width: 3px;
  }

  .modal-btn {
    padding: 12px 32px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal-btn:active { transform: scale(0.95); }

  /* scrollbar */
  .board::-webkit-scrollbar { width: 4px; }
  .board::-webkit-scrollbar-track { background: transparent; }
  .board::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>Mastermind</h1>
</div>

<div class="board-wrapper">
  <div class="board" id="board">
    <div class="board-empty" id="boardEmpty">Загадайте код и начните угадывать!</div>
  </div>
</div>

<div class="current-section">
  <div class="current-label">Текущая попытка</div>
  <div class="current-row" id="currentRow">
    <div class="peg empty" data-i="0"></div>
    <div class="peg empty" data-i="1"></div>
    <div class="peg empty" data-i="2"></div>
    <div class="peg empty" data-i="3"></div>
  </div>
</div>

<div class="control-panel">
  <div class="colors-block" id="colorsBlock"></div>
  <div class="btns-block">
    <button class="action-btn btn-check" id="btnCheck" disabled>Проверить</button>
    <button class="action-btn btn-undo" id="btnUndo">Убрать</button>
  </div>
</div>
<button class="new-game-btn" id="btnNewGame">Новая игра</button>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Победа!</h2>
    <p id="modalText">Вы угадали код за 3 попытки</p>
    <div class="modal-answer" id="modalAnswer"></div>
    <button class="modal-btn" id="modalBtn">Новая игра</button>
  </div>
</div>

<script>
(() => {
  // ── Config ──
  const COLORS = [
    { name: 'red',    hex: '#e94560' },
    { name: 'blue',   hex: '#4fc3f7' },
    { name: 'green',  hex: '#66bb6a' },
    { name: 'yellow', hex: '#ffd54f' },
    { name: 'orange', hex: '#ffa726' },
    { name: 'purple', hex: '#ab47bc' },
  ];
  const CODE_LEN = 4;
  const MAX_ATTEMPTS = 10;

  // ── State ──
  let secret = [];
  let current = [];
  let attempts = [];
  let gameOver = false;

  // ── DOM refs ──
  const board       = document.getElementById('board');
  const boardEmpty  = document.getElementById('boardEmpty');
  const currentRow  = document.getElementById('currentRow');
  const colorsBlock = document.getElementById('colorsBlock');
  const btnCheck    = document.getElementById('btnCheck');
  const btnUndo     = document.getElementById('btnUndo');
  const btnNewGame  = document.getElementById('btnNewGame');
  const modalOverlay= document.getElementById('modalOverlay');
  const modalTitle  = document.getElementById('modalTitle');
  const modalText   = document.getElementById('modalText');
  const modalAnswer = document.getElementById('modalAnswer');
  const modalBtn    = document.getElementById('modalBtn');

  // ── Init color buttons ──
  COLORS.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'color-btn';
    btn.style.background = c.hex;
    btn.style.color = c.hex;
    btn.dataset.color = c.name;
    btn.addEventListener('click', () => pickColor(c.name));
    colorsBlock.appendChild(btn);
  });

  // ── New game ──
  function newGame() {
    secret = [];
    for (let i = 0; i < CODE_LEN; i++) {
      secret.push(COLORS[Math.floor(Math.random() * COLORS.length)].name);
    }
    current = [];
    attempts = [];
    gameOver = false;
    console.log('Secret:', secret.map(c => COLORS.find(x=>x.name===c).hex)); // debug

    boardEmpty.classList.remove('hidden');
    // remove all attempt rows
    board.querySelectorAll('.attempt-row').forEach(r => r.remove());
    updateCurrentRow();
    updateButtons();
    modalOverlay.classList.remove('show');
  }

  // ── Pick color ──
  function pickColor(colorName) {
    if (gameOver) return;
    if (current.length >= CODE_LEN) return;
    current.push(colorName);
    updateCurrentRow();
    updateButtons();
  }

  // ── Undo ──
  function undo() {
    if (gameOver) return;
    if (current.length === 0) return;
    current.pop();
    updateCurrentRow();
    updateButtons();
  }

  // ── Check ──
  function check() {
    if (gameOver) return;
    if (current.length !== CODE_LEN) return;

    const result = computeResult(current, secret);
    attempts.push({ guess: [...current], result });

    boardEmpty.classList.add('hidden');
    renderAttempt(attempts.length, current, result);

    // check win
    const blacks = result.filter(d => d === 'black').length;
    if (blacks === CODE_LEN) {
      gameOver = true;
      setTimeout(() => showModal(true), 400);
      updateButtons();
      return;
    }

    // check lose
    if (attempts.length >= MAX_ATTEMPTS) {
      gameOver = true;
      setTimeout(() => showModal(false), 400);
      updateButtons();
      return;
    }

    current = [];
    updateCurrentRow();
    updateButtons();
  }

  // ── Compute result ──
  function computeResult(guess, secret) {
    const result = Array(CODE_LEN).fill(null);
    const sUsed = new Array(CODE_LEN).fill(false);
    const gUsed = new Array(CODE_LEN).fill(false);

    // blacks first
    for (let i = 0; i < CODE_LEN; i++) {
      if (guess[i] === secret[i]) {
        result[i] = 'black';
        sUsed[i] = true;
        gUsed[i] = true;
      }
    }

    // whites
    for (let i = 0; i < CODE_LEN; i++) {
      if (gUsed[i]) continue;
      for (let j = 0; j < CODE_LEN; j++) {
        if (sUsed[j]) continue;
        if (guess[i] === secret[j]) {
          result[i] = 'white';
          sUsed[j] = true;
          gUsed[i] = true;
          break;
        }
      }
    }

    return result;
  }

  // ── Render attempt row ──
  function renderAttempt(num, guess, result) {
    const row = document.createElement('div');
    row.className = 'attempt-row';

    const numEl = document.createElement('span');
    numEl.className = 'attempt-num';
    numEl.textContent = num;
    row.appendChild(numEl);

    const pegsEl = document.createElement('div');
    pegsEl.className = 'attempt-pegs';
    guess.forEach(colorName => {
      const peg = document.createElement('div');
      peg.className = 'peg';
      peg.style.background = COLORS.find(c => c.name === colorName).hex;
      pegsEl.appendChild(peg);
    });
    row.appendChild(pegsEl);

    const dotsEl = document.createElement('div');
    dotsEl.className = 'result-dots';
    result.forEach(type => {
      const dot = document.createElement('div');
      dot.className = 'dot ' + type;
      dotsEl.appendChild(dot);
    });
    row.appendChild(dotsEl);

    board.appendChild(row);
    board.scrollTop = board.scrollHeight;
  }

  // ── Update current row display ──
  function updateCurrentRow() {
    const pegs = currentRow.querySelectorAll('.peg');
    pegs.forEach((peg, i) => {
      if (i < current.length) {
        peg.classList.remove('empty');
        peg.style.background = COLORS.find(c => c.name === current[i]).hex;
      } else {
        peg.classList.add('empty');
        peg.style.background = '';
      }
    });
  }

  // ── Update buttons ──
  function updateButtons() {
    btnCheck.disabled = current.length !== CODE_LEN || gameOver;
    btnUndo.disabled = current.length === 0 || gameOver;
  }

  // ── Modal ──
  function showModal(won) {
    modalTitle.textContent = won ? '🎉 Победа!' : '😔 Игра окончена';
    modalText.textContent = won
      ? `Вы угадали код за ${attempts.length} ${pluralize(attempts.length, 'попытку', 'попытки', 'попыток')}`
      : `Правильный код был другим. Попробуйте ещё раз!`;

    modalAnswer.innerHTML = '';
    secret.forEach(colorName => {
      const peg = document.createElement('div');
      peg.className = 'peg';
      peg.style.background = COLORS.find(c => c.name === colorName).hex;
      modalAnswer.appendChild(peg);
    });

    modalOverlay.classList.add('show');
  }

  function pluralize(n, one, few, many) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    if (mod100 >= 11 && mod100 <= 19) return many;
    if (mod10 === 1) return one;
    if (mod10 >= 2 && mod10 <= 4) return few;
    return many;
  }

  // ── Event listeners ──
  btnCheck.addEventListener('click', check);
  btnUndo.addEventListener('click', undo);
  btnNewGame.addEventListener('click', newGame);
  modalBtn.addEventListener('click', newGame);

  // ── Start ──
  newGame();
})();
</script>
</body>
</html>
