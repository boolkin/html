<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>Коды ошибок ПЧ</title>
<link rel="manifest" id="manifest-link">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#252540;--accent:#4a9eff;--accent2:#3a7edf;--text:#e8e8f0;--text2:#a0a0b8;--highlight:#ffcc00;--border:#3a3a55;--err:#ff6b6b;--success:#4ecdc4;--mob:640px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
/* === HEADER === */
header{background:var(--bg2);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap;cursor:pointer;user-select:none;transition:opacity .15s}
.logo:hover{opacity:.8}
.logo span{color:var(--text2);font-weight:400;font-size:12px}
/* Desktop search bar: input + select */
.search-bar{flex:1;display:flex;gap:6px;max-width:520px;position:relative}
.search-bar .s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--text2);z-index:2}
.search-bar input{width:0;flex:1;padding:8px 12px 8px 32px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border .2s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar .vfd-chip{padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;appearance:none;display:flex;align-items:center;gap:4px;transition:border .2s}
.search-bar .vfd-chip:hover{border-color:var(--accent)}
.search-bar .vfd-chip select{background:transparent;border:none;color:var(--text);font-size:13px;appearance:none;outline:none;cursor:pointer;padding:0;width:auto}
.search-bar .vfd-chip select option{background:var(--bg2);color:var(--text);padding:6px}
.search-bar .vfd-chip .arrow{color:var(--text2);font-size:11px}
/* === LAYOUT === */
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:320px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-section{padding:6px 8px;border-bottom:1px solid var(--border)}
.sidebar-section.visible{display:flex;flex-direction:column;flex:1;overflow:hidden}
.sidebar-section h3{font-size:11px;color:var(--text2);padding:4px 8px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
/* VFD list */
.vfd-list{overflow-y:auto;padding:2px 0}
.vfd-item{padding:8px 12px;border-radius:6px;cursor:pointer;margin:1px 0;font-size:14px;transition:background .15s;display:flex;align-items:center;gap:8px}
.vfd-item:hover{background:var(--bg3)}
.vfd-item.active{background:var(--accent2);color:#fff}
.vfd-icon{width:20px;height:20px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.vfd-item.active .vfd-icon{background:#fff;color:var(--accent2)}
/* Search results */
.results-list{flex:1;overflow-y:auto;padding:2px 0}
.result-item{padding:8px 12px;border-radius:6px;cursor:pointer;margin:1px 0;transition:background .15s;display:flex;align-items:baseline;gap:8px}
.result-item:hover{background:var(--bg3)}
.result-item.active{background:var(--accent2);color:#fff}
.r-vfd{font-size:11px;color:var(--text2);background:var(--bg3);padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.result-item.active .r-vfd{background:rgba(255,255,255,.2);color:#fff}
.r-code{font-weight:700;font-size:13px;color:var(--accent);min-width:50px;white-space:pre-line;flex-shrink:0}
.r-name{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.result-item.active .r-code,.result-item.active .r-name{color:#fff}
/* === CONTENT === */
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.welcome{text-align:center;padding:60px 20px;color:var(--text2)}
.welcome h2{font-size:22px;color:var(--text);margin-bottom:8px}
.welcome p{font-size:14px;line-height:1.6}
/* Table */
.table-wrap{flex:1;overflow:auto;max-height:calc(100vh - 60px)}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13px}
.table-wrap th{background:var(--bg3);padding:10px 12px;text-align:left;font-weight:600;color:var(--accent);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:2;white-space:nowrap}
.table-wrap td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.table-wrap tr[data-rid]{cursor:pointer;transition:background .15s}
.table-wrap tr[data-rid]:hover td{background:var(--bg3)}
.table-wrap tr[data-rid].selected td{background:var(--accent2);color:#fff}
.table-wrap td:first-child{color:var(--text2);font-weight:600;min-width:30px}
.table-wrap td:nth-child(2){color:var(--accent);font-weight:700;min-width:100px}
.table-wrap td:nth-child(3){font-weight:500;min-width:140px}
td .line{display:block}
td .line::before{content:'• ';color:var(--accent)}
/* Detail card */
.detail-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px}
.detail-card h2{font-size:18px;color:var(--accent);margin-bottom:4px;white-space:pre-line}
.d-name{font-size:16px;font-weight:600;margin-bottom:16px;white-space:pre-line}
.d-section{margin-bottom:16px}
.d-section h4{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.d-section p{font-size:14px;line-height:1.7;white-space:pre-line}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--bg3);border-radius:20px;font-size:11px;color:var(--text2);margin-bottom:12px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
/* Misc */
mark.hl{background:var(--highlight);color:#000;border-radius:2px;padding:0 2px}
.no-results{padding:20px;text-align:center;color:var(--text2);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--text2)}
.offline-badge{position:fixed;top:8px;right:8px;background:var(--err);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;z-index:999;display:none}
.offline-badge.show{display:block}

/* Hide mobile-only elements on desktop */
.mob-views,.mob-detail{display:none}
/* === MOBILE VIEW === */
@media(max-width:640px){
  /* Header: logo hidden, full search bar */
  .logo span{display:none}
  .search-bar{max-width:none;flex:1}
  .search-bar .vfd-chip{font-size:12px;padding:5px 8px}
  /* Layout: no sidebar, full content */
  .main{flex-direction:column}
  .sidebar{width:100%;max-height:none;border-right:none;border-bottom:none;order:0;display:none}
  .content{order:1;padding:0}
  /* Mobile views container */
  .mob-views{flex:1;overflow-y:auto;position:relative}
  .mob-view{display:none;flex-direction:column;height:100%}
  .mob-view.active{display:flex}
  /* VFD selector as horizontal list */
  .mob-vfd-bar{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border)}
  .mob-vfd-btn{padding:6px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;transition:all .15s}
  .mob-vfd-btn:hover{border-color:var(--accent)}
  .mob-vfd-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
  /* Mobile search results */
  .mob-results{flex:1;overflow-y:auto;padding:4px 0}
  .mob-result{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:baseline;gap:8px;transition:background .15s}
  .mob-result:hover{background:var(--bg3)}
  .mob-result.active{background:var(--accent2);color:#fff}
  .mob-result .mr-vfd{font-size:11px;color:var(--text2);background:var(--bg3);padding:2px 6px;border-radius:4px;white-space:nowrap}
  .mob-result.active .mr-vfd{background:rgba(255,255,255,.2);color:#fff}
  .mob-result .mr-code{font-weight:700;font-size:14px;color:var(--accent);min-width:50px;white-space:pre-line}
  .mob-result .mr-name{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mob-result.active .mr-code,.mob-result.active .mr-name{color:#fff}
  /* Mobile detail: full screen overlay */
  .mob-detail{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;overflow-y:auto}
  .mob-detail.active{display:flex}
  .mob-detail-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
  .mob-back-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;transition:background .15s}
  .mob-back-btn:hover{background:var(--accent2);color:#fff}
  .mob-back-btn svg{width:16px;height:16px;fill:currentColor}
  .mob-detail-body{flex:1;overflow-y:auto;padding:16px}
  /* Mobile table view */
  .mob-table-wrap{flex:1;overflow:auto}
}
</style>
</head>
<body>
<div class="offline-badge" id="offlineBadge">OFFLINE</div>
<header>
<div class="logo" id="logoBtn">ПЧ-Ошибки <span>поиск кодов ошибок</span></div>
<div class="search-bar">
<svg class="s-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
<input type="text" id="searchInput" placeholder="Поиск по всем полям..." autocomplete="off">
<div class="vfd-chip"><select id="vfdSelect"><option value="">Все ПЧ</option></select><span class="arrow">▾</span></div>
</div>
</header>

<!-- DESKTOP: sidebar + content -->
<div class="main" id="desktopMain">
<div class="sidebar" id="sidebar">
<div class="sidebar-section" id="vfdSection">
<h3>Преобразователи</h3>
<div class="vfd-list" id="vfdList"></div>
</div>
<div class="sidebar-section" id="resultsSection" style="display:none">
<h3>Результаты поиска <span id="resultsCount"></span></h3>
<div class="results-list" id="resultsList"></div>
</div>
</div>
<div class="content" id="contentArea">
<div class="welcome">
<h2>Коды ошибок частотных преобразователей</h2>
<p>Выберите преобразователь из списка или используйте поиск для поиска ошибок по всем полям.</p>
</div>
</div>
</div>

<!-- MOBILE: views container (hidden on desktop) -->
<div class="mob-views" id="mobViews" style="display:none">
<div class="mob-view" id="mobDefault">
<div class="mob-vfd-bar" id="mobVfdBar"></div>
<div class="mob-results" id="mobDefaultList"></div>
</div>
<div class="mob-view" id="mobSearch">
<div class="mob-results" id="mobSearchList"></div>
</div>
</div>

<!-- MOBILE: detail overlay -->
<div class="mob-detail" id="mobDetail">
<div class="mob-detail-bar">
<div class="mob-back-btn" id="mobBackBtn">
<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
Назад
</div>
<span id="mobDetailTitle" style="font-size:14px;color:var(--text2)"></span>
</div>
<div class="mob-detail-body" id="mobDetailBody"></div>
</div>

<script>
const BASE='';
let listData=[],vfdCache={},allData=[],currentVfd=null,searchTerm='';
const $=id=>document.getElementById(id);
const isMobile=()=>window.innerWidth<=640;

async function init(){
  try{
    const r=await fetch(BASE+'list.json');
    listData=await r.json();
  }catch(e){
    showMsg('Не удалось загрузить list.json. Запустите через HTTP-сервер.');
    return;
  }
  renderVfdList();
  populateSelect();
  await loadAllData();
  applyLayout();
  window.addEventListener('resize',applyLayout);
}

function showMsg(t){
  const area=isMobile()?'mobDefaultList':'contentArea';
  $(area).innerHTML=`<div class="empty">${t}</div>`;
}

/* === LAYOUT SWITCH === */
function applyLayout(){
  const mob=isMobile();
  $('desktopMain').style.display=mob?'none':'flex';
  $('mobViews').style.display=mob?'flex':'none';
  if(mob)renderMobile();
  else renderDesktop();
}

function renderDesktop(){
  if(currentVfd!==null)showVfdTable(currentVfd);
  else if(!searchTerm)showWelcome();
  if(searchTerm)doSearch();
}

function renderMobile(){
  renderMobVfdBar();
  if(searchTerm)doSearch();
  else showMobDefaultList();
}

/* === VFD LIST === */
function renderVfdList(){
  $('vfdList').innerHTML=listData.map((v,i)=>`<div class="vfd-item" data-idx="${i}"><div class="vfd-icon">ПЧ</div>${v.alias}</div>`).join('');
  $('vfdList').querySelectorAll('.vfd-item').forEach(el=>{
    el.addEventListener('click',()=>selectVfd(+el.dataset.idx));
  });
}

function renderMobVfdBar(){
  const bar=$('mobVfdBar');
  bar.innerHTML=listData.map((v,i)=>`<div class="mob-vfd-btn" data-idx="${i}">${v.alias}</div>`).join('');
  bar.querySelectorAll('.mob-vfd-btn').forEach(el=>{
    el.addEventListener('click',()=>selectVfd(+el.dataset.idx));
  });
  if(currentVfd!==null)bar.querySelectorAll('.mob-vfd-btn').forEach(el=>el.classList.toggle('active',+el.dataset.idx===currentVfd));
}

function populateSelect(){
  const sel=$('vfdSelect');
  listData.forEach((v,i)=>{
    const o=document.createElement('option');o.value=i;o.textContent=v.alias;sel.appendChild(o);
  });
  sel.addEventListener('change',()=>{
    if(sel.value===''){currentVfd=null;doSearch();renderMobVfdBar();
      if(!searchTerm&&!isMobile())showWelcome()}
    else selectVfd(+sel.value);
  });
}

async function selectVfd(idx){
  currentVfd=idx;
  $('vfdList').querySelectorAll('.vfd-item').forEach(el=>el.classList.toggle('active',+el.dataset.idx===idx));
  $('vfdSelect').value=idx;
  renderMobVfdBar();
  await loadVfd(idx);
  doSearch();
  // If no search term → show full table (desktop) or full list (mobile)
  if(!searchTerm){
    if(!isMobile())showVfdTable(idx);
    if(isMobile())showMobDefaultList();
  }
}

/* === DATA LOADING === */
async function loadAllData(){for(let i=0;i<listData.length;i++)await loadVfd(i)}

async function loadVfd(idx){
  if(vfdCache[idx])return;
  const v=listData[idx];
  try{const r=await fetch(BASE+v.file);vfdCache[idx]=await r.json()}catch(e){vfdCache[idx]=null}
}

function buildAllData(){
  allData=[];
  listData.forEach((v,idx)=>{
    const d=vfdCache[idx];if(!d)return;
    d.data.forEach(row=>{allData.push({vfdIdx:idx,vfdAlias:v.alias,columns:d.columns,row})});
  });
}

function getVisibleData(){
  buildAllData();
  if(currentVfd!==null)return allData.filter(d=>d.vfdIdx===currentVfd);
  return allData;
}

/* === DESKTOP VIEWS === */
function showVfdTable(idx){
  if(isMobile())return;
  const d=vfdCache[idx];
  if(!d){$('contentArea').innerHTML='<div class="empty">Не удалось загрузить данные</div>';return}
  const cols=d.columns;
  let h='<div class="table-wrap"><table><thead><tr>';
  cols.forEach(c=>h+=`<th>${c.alias}</th>`);
  h+='</tr></thead><tbody>';
  d.data.forEach(row=>{
    h+=`<tr data-rid="${row.id}" class="clickable-row">`;
    cols.forEach(c=>{
      const val=row[c.original]||'';
      const lines=String(val).split('\n');
      const cell=lines.map(l=>l.trim()?`<span class="line">${esc(l)}</span>`:'').join('');
      h+=`<td>${cell}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  $('contentArea').innerHTML=h;
  // Make table rows clickable → show detail card
  $('contentArea').querySelectorAll('tr[data-rid]').forEach(tr=>{
    tr.addEventListener('click',()=>{showDesktopDetail(idx,+tr.dataset.rid,null);hlTableRow(tr)});
  });
}
function hlTableRow(tr){
  $('contentArea').querySelectorAll('tr[data-rid]').forEach(r=>r.classList.remove('selected'));
  tr.classList.add('selected');
}

function showDesktopDetail(vfdIdx,rowId,clickedEl){
  $('resultsList').querySelectorAll('.result-item').forEach(el=>el.classList.remove('active'));
  if(clickedEl)clickedEl.classList.add('active');
  const d=vfdCache[vfdIdx];if(!d)return;
  const row=d.data.find(r=>r.id===rowId);if(!row)return;
  const cols=d.columns;
  let h=`<div class="detail-card"><div class="badge"><span class="dot"></span>${esc(listData[vfdIdx].alias)}</div>`;
  h+=`<h2>${hl(String(row[cols[1].original]),searchTerm)}</h2>`;
  h+=`<div class="d-name">${hl(String(row[cols[2].original]),searchTerm)}</div>`;
  for(let i=3;i<cols.length;i++){
    h+=`<div class="d-section"><h4>${esc(cols[i].alias)}</h4><p>${hl(String(row[cols[i].original]||''),searchTerm)}</p></div>`;
  }
  h+='</div>';
  $('contentArea').innerHTML=h;
}

/* === MOBILE VIEWS === */
function showMobDefaultList(){
  const list=$('mobDefaultList');
  if(currentVfd===null){
    list.innerHTML='<div class="welcome"><h2>Коды ошибок ПЧ</h2><p>Выберите преобразователь или используйте поиск.</p></div>';
    $('mobDefault').classList.add('active');$('mobSearch').classList.remove('active');
    return;
  }
  const data=getVisibleData();
  if(!data.length){list.innerHTML='<div class="empty">Нет данных</div>';return}
  list.innerHTML=data.map(d=>{
    const code=String(d.row[d.columns[1].original]).split('\n')[0];
    const name=String(d.row[d.columns[2].original]).split('\n')[0];
    return `<div class="mob-result" data-vi="${d.vfdIdx}" data-rid="${d.row.id}"><span class="mr-vfd">${esc(d.vfdAlias)}</span><span class="mr-code">${esc(code)}</span><span class="mr-name">${esc(name)}</span></div>`;
  }).join('');
  list.querySelectorAll('.mob-result').forEach(el=>{
    el.addEventListener('click',()=>openMobDetail(+el.dataset.vi,+el.dataset.rid));
  });
  $('mobDefault').classList.add('active');$('mobSearch').classList.remove('active');
}

function showMobSearchResults(results){
  const list=$('mobSearchList');
  if(!results.length){list.innerHTML='<div class="no-results">Ничего не найдено</div>';return}
  list.innerHTML=results.map(r=>{
    const code=String(r.row[r.columns[1].original]).split('\n')[0];
    const name=String(r.row[r.columns[2].original]).split('\n')[0];
    return `<div class="mob-result" data-vi="${r.vfdIdx}" data-rid="${r.row.id}"><span class="mr-vfd">${esc(r.vfdAlias)}</span><span class="mr-code">${esc(code)}</span><span class="mr-name">${esc(name)}</span></div>`;
  }).join('');
  list.querySelectorAll('.mob-result').forEach(el=>{
    el.addEventListener('click',()=>openMobDetail(+el.dataset.vi,+el.dataset.rid));
  });
  $('mobDefault').classList.remove('active');
  $('mobSearch').classList.add('active');
}

function openMobDetail(vfdIdx,rowId){
  const d=vfdCache[vfdIdx];if(!d)return;
  const row=d.data.find(r=>r.id===rowId);if(!row)return;
  const cols=d.columns;
  const code=String(row[cols[1].original]).split('\n')[0];
  $('mobDetailTitle').textContent=`${listData[vfdIdx].alias} — ${code}`;
  let h=`<div class="detail-card"><div class="badge"><span class="dot"></span>${esc(listData[vfdIdx].alias)}</div>`;
  h+=`<h2>${hl(String(row[cols[1].original]),searchTerm)}</h2>`;
  h+=`<div class="d-name">${hl(String(row[cols[2].original]),searchTerm)}</div>`;
  for(let i=3;i<cols.length;i++){
    h+=`<div class="d-section"><h4>${esc(cols[i].alias)}</h4><p>${hl(String(row[cols[i].original]||''),searchTerm)}</p></div>`;
  }
  h+='</div>';
  $('mobDetailBody').innerHTML=h;
  $('mobDetail').classList.add('active');
}

function closeMobDetail(){$('mobDetail').classList.remove('active')}
$('mobBackBtn').addEventListener('click',closeMobDetail);

/* === SEARCH === */
let searchTimeout;
$('searchInput').addEventListener('input',()=>{clearTimeout(searchTimeout);searchTimeout=setTimeout(doSearch,200)});

function doSearch(){
  searchTerm=$('searchInput').value.trim().toLowerCase();
  if(isMobile()){doMobileSearch();return}
  const resSection=$('resultsSection');
  const vfdSection=$('vfdSection');
  if(!searchTerm){
    resSection.style.display='none';resSection.classList.remove('visible');
    vfdSection.style.borderBottom='1px solid var(--border)';
    if(currentVfd!==null)showVfdTable(currentVfd);else showWelcome();
    return;
  }
  resSection.style.display='';resSection.classList.add('visible');
  vfdSection.style.borderBottom='none';
  const data=getVisibleData();
  const results=data.filter(d=>{
    return d.columns.some(c=>String(d.row[c.original]||'').toLowerCase().includes(searchTerm));
  });
  $('resultsCount').textContent=`(${results.length})`;
  const list=$('resultsList');
  if(!results.length){list.innerHTML='<div class="no-results">Ничего не найдено</div>';return}
  list.innerHTML=results.map(r=>{
    const code=String(r.row[r.columns[1].original]).split('\n')[0];
    const name=String(r.row[r.columns[2].original]).split('\n')[0];
    const showVfd=currentVfd===null;
    return `<div class="result-item" data-vi="${r.vfdIdx}" data-rid="${r.row.id}">
      ${showVfd?`<span class="r-vfd">${esc(r.vfdAlias)}</span>`:''}
      <span class="r-code">${esc(code)}</span><span class="r-name">${esc(name)}</span></div>`;
  }).join('');
  list.querySelectorAll('.result-item').forEach(el=>{
    el.addEventListener('click',()=>showDesktopDetail(+el.dataset.vi,+el.dataset.rid,el));
  });
  // Show first result detail
  if(results.length&&!searchTerm.startsWith('_'))showDesktopDetail(results[0].vfdIdx,results[0].row.id,list.querySelector('.result-item'));
}

function doMobileSearch(){
  if(!searchTerm){showMobDefaultList();return}
  const data=getVisibleData();
  const results=data.filter(d=>{
    return d.columns.some(c=>String(d.row[c.original]||'').toLowerCase().includes(searchTerm));
  });
  showMobSearchResults(results);
}

/* === UTILS === */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(text,term){
  if(!term)return esc(text).replace(/\n/g,'<br>');
  const e=esc(text),te=esc(term);
  const rx=new RegExp(`(${te.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
  return e.replace(rx,'<mark class="hl">$1</mark>').replace(/\n/g,'<br>');
}

/* === PWA === */
function setupPWA(){
  const manifest={name:'Коды ошибок ПЧ',short_name:'ПЧ-Ошибки',start_url:'./',display:'standalone',background_color:'#0f0f1a',theme_color:'#1a1a2e',icons:[{src:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%2280%22 height=%2280%22 x=%2210%22 y=%2210%22 rx=%2212%22 fill=%22%234a9eff%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22white%22 font-weight=%22bold%22>ПЧ</text></svg>',sizes:'192x192',type:'image/svg+xml'}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  $('manifest-link').href=URL.createObjectURL(blob);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register(BASE+'sw.js').then(reg=>{
      reg.onupdatefound=()=>{const nw=reg.installing;nw.onstatechange=()=>{if(nw.state==='activated')location.reload()}};
    }).catch(()=>{});
  }
}

window.addEventListener('online',()=>{$('offlineBadge').classList.remove('show')});
window.addEventListener('offline',()=>{$('offlineBadge').classList.add('show')});
if(!navigator.onLine)$('offlineBadge').classList.add('show');

// Logo click: reset everything
$('logoBtn').addEventListener('click',resetAll);
function resetAll(){
  currentVfd=null;searchTerm='';
  $('searchInput').value='';
  $('vfdSelect').value='';
  $('vfdList').querySelectorAll('.vfd-item').forEach(el=>el.classList.remove('active'));
  $('resultsSection').style.display='none';$('resultsSection').classList.remove('visible');
  $('vfdSection').style.borderBottom='1px solid var(--border)';
  closeMobDetail();
  renderMobVfdBar();
  applyLayout();
}

function showWelcome(){
  $('contentArea').innerHTML='<div class="welcome"><h2>Коды ошибок частотных преобразователей</h2><p>Выберите преобразователь из списка или используйте поиск для поиска ошибок по всем полям.</p></div>';
}

setupPWA();
init();
</script>
